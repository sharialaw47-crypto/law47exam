<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>بوابة الاستعلام عن الاختبارات - كلية الشريعة والقانون</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; margin: 0; padding: 20px; direction: rtl; display: flex; flex-direction: column; min-height: 100vh; }
        .main-wrapper { flex: 1; }
        
        .header {
            background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);
            padding: 20px 30px;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 950px;
            margin: 0 auto 25px auto;
            border-bottom: 5px solid #0056b3;
        }
        .header img { height: 95px; width: auto; max-width: 140px; object-fit: contain; border-radius: 6px; }
        .header-title { text-align: center; flex: 1; margin: 0 15px; }
        .header-title h2 { color: #2c3e50; margin: 0 0 5px 0; font-size: 19px; font-weight: 600; }
        .header-title h1 { color: #0056b3; margin: 0; font-size: 24px; font-weight: 800; }
        .header-title h3 { color: #7f8c8d; margin: 5px 0 0 0; font-size: 15px; font-weight: 500; }

        .card { background: white; padding: 30px; border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); max-width: 950px; margin: 0 auto; }
        .main-tabs { display: flex; gap: 15px; justify-content: center; margin-bottom: 25px; }
        .tab-btn { flex: 1; padding: 15px; font-size: 17px; font-weight: bold; border: 2px solid #0056b3; background: #f8f9fa; color: #0056b3; border-radius: 8px; cursor: pointer; transition: all 0.3s ease; }
        .tab-btn:hover, .tab-btn.active { background: #0056b3; color: white; box-shadow: 0 4px 10px rgba(0,86,179,0.3); }
        
        #facultyLoginBox { text-align: center; padding: 25px; background: #f8f9fa; border-radius: 10px; border: 1px dashed #cbd5e1; margin-bottom: 20px; }
        #facultyContentArea { display: none; }
        .sub-tabs { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; background: #e9ecef; padding: 8px; border-radius: 6px; }
        .sub-tab-btn { flex: 1; padding: 10px; font-size: 15px; font-weight: bold; border: none; background: transparent; color: #495057; border-radius: 4px; cursor: pointer; }
        .sub-tab-btn.active { background: white; color: #0056b3; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .search-section { display: none; text-align: center; }
        .search-section.active { display: block; }
        .search-box { display: flex; gap: 10px; max-width: 500px; margin: 15px auto 0 auto; }
        input, select { padding: 10px; border: 1px solid #ced4da; border-radius: 6px; font-size: 15px; text-align: center; }
        .search-btn { padding: 12px 25px; background-color: #0056b3; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; font-weight: bold; }
        .search-btn:hover { background-color: #003d80; }
        
        .filter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; background: #f1f5f9; padding: 18px; border-radius: 8px; margin-bottom: 20px; align-items: center; }
        .filter-item { display: flex; flex-direction: column; gap: 5px; text-align: right; }
        .filter-item label { font-size: 13px; font-weight: bold; color: #475569; }

        .attendance-sheet { border: 1px solid #ccc; padding: 20px; background: #fff; text-align: right; margin-top: 15px; border-radius: 8px; }
        .sheet-header-top { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 15px; }
        .sheet-header-logo { height: 85px; width: auto; object-fit: contain; }
        .sheet-info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: #fafafa; padding: 12px; border: 1px solid #eaeaea; font-size: 14px; margin-bottom: 15px; border-radius: 4px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #000; padding: 8px; text-align: center; font-size: 13px; }
        th { background-color: #f2f2f2; font-weight: bold; color: #000; }
        
        .signatures-area { margin-top: 30px; display: flex; justify-content: space-around; text-align: center; font-weight: bold; font-size: 14px; padding-top: 20px; }
        .count-summary { display: flex; justify-content: space-around; margin-top: 20px; font-weight: bold; font-size: 15px; border-top: 1px dashed #ccc; padding-top: 10px; }

        .error { color: #dc3545; margin-top: 15px; font-weight: bold; text-align: center; }
        .thanks-footer { margin-top: 20px; font-size: 16px; font-weight: bold; color: #004085; background-color: #cce5ff; padding: 12px; border-radius: 6px; text-align: center; }
        .student-wishes { margin-top: 20px; font-size: 16px; font-weight: bold; color: #155724; background-color: #d4edda; padding: 12px; border-radius: 6px; text-align: center; border: 1px solid #c3e6cb; }

        .page-footer {
            text-align: center;
            margin-top: 40px;
            padding: 15px;
            font-size: 13px;
            color: #6c757d;
            border-top: 1px solid #dee2e6;
            font-weight: 600;
        }

        @media print {
            @page { size: A4; margin: 10mm; }
            body * { visibility: hidden; }
            body { padding: 0; background: #fff; }
            .attendance-sheet, .attendance-sheet * { visibility: visible; }
            .attendance-sheet { position: absolute; left: 0; top: 0; width: 100%; border: none; padding: 0; }
            .no-print { display: none !important; }
            .page-footer { display: block !important; position: fixed; bottom: 0; width: 100%; border: none; font-size: 11px; }
        }
    </style>

                    <div id="proctoringSub" class="sub-content">
                        <div id="facultyResult"></div>
                    </div>

                    <div id="schedulesSub" class="sub-content" style="display: none;">
                        <div class="filter-grid no-print">
                            <div class="filter-item">
                                <label>الشطر</label>
                                <select id="genderFilter" onchange="onGenderChange()">
                                    <option value="male" selected>الطلاب</option>
                                    <option value="female">الطالبات</option>
                                </select>
                            </div>
                            <div class="filter-item">
                                <label>رقم الشعبة (اكتب أو اختر)</label>
                                <input type="text" id="sectionFilter" list="sectionsList" value="24" oninput="syncCourseBySection()" placeholder="أدخل رقم الشعبة...">
                                <datalist id="sectionsList">
                                    <option value="24">شعبة 24 (تأمين)</option>
                                    <option value="44">شعبة 44 (إجراءات جزائية)</option>
                                    <option value="36">شعبة 36 (دولي خاص)</option>
                                    <option value="8">شعبة 8 (أصول الفقه)</option>
                                    <option value="27">شعبة 27 (إجراءات جزائية - طالبات)</option>
                                    <option value="28">شعبة 28 (القضاء والإثبات)</option>
                                    <option value="29">شعبة 29 (فقه الأسرة-2)</option>
                                </datalist>
                            </div>
                            <div class="filter-item">
                                <label>اسم المقرر</label>
                                <select id="courseFilter" onchange="syncSectionByCourse()">
                                    <!-- يتم تحميل الخيارات آلياً بحسب الشطر -->
                                </select>
                            </div>
                            <div class="filter-item">
                                <label>القاعة (اللجنة)</label>
                                <select id="roomFilter" onchange="updateSheets()">
                                    <option value="1">قاعة 1</option>
                                    <option value="2">قاعة 2</option>
                                    <option value="SO19">قاعة SO19</option>
                                </select>
                            </div>
                            <div class="filter-item" style="justify-content: flex-end;">
                                <button class="search-btn" onclick="window.print()" style="background-color: #28a745;">طباعة الكشف</button>
                            </div>
                        </div>

                        <div id="attendanceSheetContainer"></div>
                    </div>
                </div>
            </div>

            <div id="studentsSection" class="search-section">
                <label for="studentId" style="font-weight: bold; display: block; margin-bottom: 8px;">الرقم الجامعي للطالب/ الطالبة:</label>

                    <input type="text" id="studentId" placeholder="أدخل الرقم الجامعي هنا...">
                    <button class="search-btn" onclick="searchStudent()">بحث</button>
                </div>
                <div id="studentResult"></div>
            </div>
        </div>
    </div>

        function generateCompleteStudentData() {
            let list = [];
            const addEntries = (array, courseObj) => {
                array.forEach(item => {
                    let existing = list.find(s => s.id === item.id);
                    if (existing) {
                        existing.courses.push(courseObj);
                        if(item.name) existing.name = item.name;
                    } else {
                        list.push({ id: item.id, name: item.name, courses: [courseObj] });
                    }
                });
            };

            addEntries(penalList, penal_R1);
            addEntries(intListRoom1, int_R1);
            addEntries(intListRoom2, int_R2);
            addEntries(insListRoom1, ins_R1);
            addEntries(insListRoom2, ins_R2);
            addEntries(femaleUsulList, usul_Female);
            addEntries(femaleEjraatList, ejraat_Female);
            addEntries(femaleQadaList, qada_Female);
            addEntries(femaleOsraList, osra_Female);

            return list;
        }

        function populateCourseOptions() {
            const gender = document.getElementById('genderFilter').value;
            const courseSelect = document.getElementById('courseFilter');
            courseSelect.innerHTML = '';

            if (gender === 'male') {
                courseSelect.innerHTML = `
                    <option value="ins" selected>نظام التأمين (425قنن)</option>
                    <option value="penal">نظام الإجراءات الجزائية (411قنن)</option>
                    <option value="int">النظام الدولي الخاص (421قنن)</option>
                `;
            } else {
                courseSelect.innerHTML = `
                    <option value="usul" selected>أصول الفقه (424أصل-3)</option>
                    <option value="ejraat_female">الإجراءات الجزائية (430نظم-2)</option>
                    <option value="qada_female">القضاء والإثبات (417فقه-3)</option>
                    <option value="osra_female">فقه الأسرة-2 (327فقه-2)</option>
                `;
            }
        }

        function onGenderChange() {
            const gender = document.getElementById('genderFilter').value;
            const roomSelect = document.getElementById('roomFilter');
            
            populateCourseOptions();

            if(gender === 'female') {
                roomSelect.value = 'SO19';
            } else {
                roomSelect.value = '1';
            }
            syncSectionByCourse();
        }

        function syncCourseBySection() {
            const sec = document.getElementById('sectionFilter').value.trim();
            const courseSelect = document.getElementById('courseFilter');
            const genderSelect = document.getElementById('genderFilter');

            if (sec === "24") { genderSelect.value = "male"; populateCourseOptions(); courseSelect.value = "ins"; }
            else if (sec === "44") { genderSelect.value = "male"; populateCourseOptions(); courseSelect.value = "penal"; }
            else if (sec === "36") { genderSelect.value = "male"; populateCourseOptions(); courseSelect.value = "int"; }
            else if (sec === "8") { genderSelect.value = "female"; populateCourseOptions(); courseSelect.value = "usul"; }
            else if (sec === "27") { genderSelect.value = "female"; populateCourseOptions(); courseSelect.value = "ejraat_female"; }
            else if (sec === "28") { genderSelect.value = "female"; populateCourseOptions(); courseSelect.value = "qada_female"; }
            else if (sec === "29") { genderSelect.value = "female"; populateCourseOptions(); courseSelect.value = "osra_female"; }
            
            updateSheets();
        }

        function syncSectionByCourse() {
            const course = document.getElementById('courseFilter').value;
            const secInput = document.getElementById('sectionFilter');

            if (course === "ins") { secInput.value = "24"; }
            else if (course === "penal") { secInput.value = "44"; }
            else if (course === "int") { secInput.value = "36"; }
            else if (course === "usul") { secInput.value = "8"; }
            else if (course === "ejraat_female") { secInput.value = "27"; }
            else if (course === "qada_female") { secInput.value = "28"; }
            else if (course === "osra_female") { secInput.value = "29"; }

            updateSheets();
        }

        function updateSheets() {
            const courseKey = document.getElementById('courseFilter').value;
            const room = document.getElementById('roomFilter').value;
            const container = document.getElementById('attendanceSheetContainer');

            let courseData = null;
            let studentList = [];

            if (courseKey === 'penal') {
                courseData = penal_R1; studentList = penalList;
            } else if (courseKey === 'int') {
                courseData = (room === '2') ? int_R2 : int_R1;
                studentList = (room === '2') ? intListRoom2 : intListRoom1;
            } else if (courseKey === 'ins') {
                courseData = (room === '2') ? ins_R2 : ins_R1;
                studentList = (room === '2') ? insListRoom2 : insListRoom1;
            } else if (courseKey === 'usul') {
                courseData = usul_Female; studentList = femaleUsulList;
            } else if (courseKey === 'ejraat_female') {
                courseData = ejraat_Female; studentList = femaleEjraatList;
            } else if (courseKey === 'qada_female') {
                courseData = qada_Female; studentList = femaleQadaList;
            } else if (courseKey === 'osra_female') {
                courseData = osra_Female; studentList = femaleOsraList;
            }

            if (!courseData) return;

            let rowsHtml = studentList.map((st, idx) => `
                <tr>
                    <td>${idx + 1}</td>
                    <td>${st.id}</td>
                    <td style="text-align: right; padding-right: 15px;">${st.name}</td>
                    <td></td>
                    <td></td>
                </tr>
            `).join('');

            container.innerHTML = `
                <div class="attendance-sheet">
                    <div class="sheet-header-top">
                        <div style="text-align: right;">
                            <strong>المملكة العربية السعودية</strong><br>
                             وزارة التعليم<br>
                             جامعة جازان<br>
                             كلية الشريعة والقانون
                        </div>
                        <img src="https://cdn.phototourl.com/free/2026-08-03-595b3f0e-ace4-4b94-bd38-30d21872c3b6.jpg" class="sheet-header-logo" alt="شعار الجامعة">
                        <div style="text-align: left;">
                            <strong>كشف حضور وتوقيع الطلاب/ الطالبات</strong><br>
                            في الاختبار النهائي للعام 1448هـ<br>
                            الفصل الصيفي
                        </div>
                    </div>

                    <div class="sheet-info-grid">
                        <div><strong>اسم المقرر:</strong> ${courseData.name} (${courseData.code})</div>
                        <div><strong>أستاذ المقرر:</strong> ${courseData.instructor}</div>
                        <div><strong>رقم الشعبة:</strong> ${courseData.section}</div>
                        <div><strong>مقر الاختبار:</strong> ${courseData.center}</div>
                        <div><strong>اليوم والتاريخ:</strong> ${courseData.day} ${courseData.date}</div>
                        <div><strong>الوقت / القاعة:</strong> ${courseData.time} (قاعة ${courseData.room})</div>
                    </div>

                    <table>
                        <thead>
                            <tr>
                                <th style="width: 5%;">م</th>
                                <th style="width: 20%;">الرقم الجامعي</th>
                                <th style="width: 40%;">الاسم</th>
                                <th style="width: 15%;">حالة الطالب</th>
                                <th style="width: 20%;">التوقيع</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${rowsHtml}
                        </tbody>
                    </table>

                    <div class="count-summary">
                        <span>إجمالي المسجلين: ${studentList.length}</span>
                        <span>عدد الحاضرين: ........</span>
                        <span>عدد الغائبين: ........</span>
                    </div>

                    <div class="signatures-area">
                        <div>اسم رئيس اللجنة: ................................... التوقيع: ...................</div>
                        <div>اسم المراقب الأول: ................................... التوقيع: ...................</div>
                    </div>
                </div>
            `;
        }

        window.onload = function() {
            populateCourseOptions();
            updateSheets();
        };
    </script>
</body>
</html>
